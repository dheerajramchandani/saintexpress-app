server {
    listen 443 ssl;
    server_name stats.saintexpress.org;

    # Add these lines to direct stats logs to a separate file
    access_log /var/log/nginx/stats-access.log combined;
    error_log /var/log/nginx/stats-error.log;

    # Add your SSL certificate paths here (Certbot usually does this)
    ssl_certificate /etc/letsencrypt/live/stats.saintexpress.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/stats.saintexpress.org/privkey.pem; # managed by Certbot
    # server_name stats.saintexpress.org; # managed by Certbot
    # ssl_certificate /etc/letsencrypt/live/stats.mydomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/stats.mydomain.com/privkey.pem;

    root /var/www/stats;
    index index.html;

    location / {
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd-stats;
        try_files $uri $uri/ =404;
    }

    # This part is crucial for Real-Time updates via WebSockets
    location /ws {
        proxy_pass http://goaccess:7890;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }
}

server {
    listen 80;
    server_name stats.saintexpress.org;

    # Redirect all HTTP to HTTPS (Recommended)
    return 301 https://$host$request_uri;
}
