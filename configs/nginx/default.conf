server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Catch-all for HTTPS as well
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    # Use your existing Certbot certificates so Nginx can handle the HTTPS handshake before dropping
    ssl_certificate /etc/letsencrypt/live/saintexpress.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saintexpress.org/privkey.pem;

    server_name _;

    # 444 closes the connection immediately without sending headers
    return 444;
}
