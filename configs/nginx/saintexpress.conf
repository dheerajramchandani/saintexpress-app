server {
    server_name saintexpress.org www.saintexpress.org; # Replace with your VM IP if you have it

    # Frontend (Angular)
    location / {
        root /usr/share/nginx/html; # Matches the container volume mount point
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Backend API (Python)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M; # Increasing the limit to allow file uploads >=1M
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/saintexpress.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/saintexpress.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.saintexpress.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = saintexpress.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name saintexpress.org www.saintexpress.org;
    return 404; # managed by Certbot




}
